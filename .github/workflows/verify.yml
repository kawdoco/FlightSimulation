name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: bash mvnw --batch-mode verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Install browser test runtime
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flight_test
          POSTGRES_USER: flight_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flight_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      MIGRATION_TEST_URL: jdbc:postgresql://localhost:5432/flight_test
      MIGRATION_TEST_DRIVER: org.postgresql.Driver
      MIGRATION_TEST_USERNAME: flight_test
      MIGRATION_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate PostgreSQL migrations
        working-directory: backend
        run: bash mvnw --batch-mode -Dtest=MigrationTest test
      - name: Verify concurrent flight starts on PostgreSQL
        working-directory: backend
        run: bash mvnw --batch-mode -Dtest=FlightConcurrencyTest test


