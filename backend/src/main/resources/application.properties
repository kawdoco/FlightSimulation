# Application
spring.application.name=FlightSimulation
spring.profiles.active=${APP_PROFILE:local}

# Server
server.port=8081

# Default to local H2 unless a database URL is supplied via environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:flightsimulation;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Spring Boot reads controller ESP32 telemetry directly over USB serial.
flightsimulation.serial.enabled=${SERIAL_ENABLED:false}
flightsimulation.serial.port=COM3
flightsimulation.serial.baud-rate=115200
flightsimulation.serial.flight-id=1

# Correlate API responses with server log entries without logging credentials.
logging.pattern.level=%5p [request:%X{requestId:-none}]

spring.flyway.enabled=false
