# Supabase PostgreSQL uses the backend REST API; no service-role key goes to React.
spring.config.import=classpath:application-prod.properties
# Isolate application tables from Supabase-managed/public objects.
spring.jpa.properties.hibernate.default_schema=flightsimulation
spring.flyway.schemas=flightsimulation
spring.flyway.default-schema=flightsimulation
spring.flyway.create-schemas=true


